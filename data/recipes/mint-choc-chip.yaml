id: mint-choc-chip
name: Mint Choc Chip
emoji: "🌿"
category: Dairy
reviewed: true
base: white-base
accent: emerald
notes: Baking chocolate is sawed at a shallow angle with a serrated bread knife into thin shards and speckles so it melts cleanly on the tongue with zero added oil.

steps:
  - phase: flavor
    title: Stir in peppermint & vanilla
    emoji: "🌿"
    add:
      peppermint_oil: 4 drops | or 6g (1.5 tsp) standard peppermint extract
      vanilla: 4g
    do: Gently stir the peppermint oil and vanilla extract into the white dairy base with a spoon.

  - phase: chill
    title: Chill base
    emoji: "❄️"
    timer: 2h
    do: Refrigerate covered for 2–4 hours until thoroughly cold so the guar gum hydrates.

  - phase: churn
    title: Churn base
    emoji: "🍦"
    timer: 20m
    do: Pour chilled Mint base into the spinning machine. While it churns, saw the dark baking chocolate off a corner at a shallow angle with a serrated bread knife into thin shards and fine speckles (avoid thick cubes).

  - phase: mix_in
    title: Add shaved chocolate & pack
    emoji: "🍫"
    timer: 45s
    add:
      dark_chocolate: 100g | baking bar, shaved with a bread knife
    do: Pour the shaved chocolate into the spinning machine during the final 45 seconds of churning until evenly dispersed, then transfer to your chilled freezer tub.
