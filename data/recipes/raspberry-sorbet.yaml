id: raspberry-sorbet
name: Raspberry Sorbet
emoji: "🍇"
category: Sorbet
reviewed: false
accent: rose
notes: Berries are pulsed briefly and strained before blitzing in the sugar and guar gum so seeds never shatter into bitter grit.

steps:
  - phase: prep
    title: Whisk dry mix
    emoji: "🥣"
    add:
      sugar: 180g
      guar_gum: 0.4g
      salt: 0.5g | pinch
    do: Whisk the sugar, guar gum, and salt together in a dry bowl so no lumps form, and set aside.

  - phase: prep
    title: Pulse raspberries briefly
    emoji: "⚡"
    timer: 15s
    add:
      raspberries: 400g
      water: 200g
      lemon_juice: 15g
    do: Combine raspberries, cold water, and lemon juice in a pitcher. Pulse with your Stabmixer for just 10–15 seconds to break the berries open without pulverizing the seeds into bitter grit.

  - phase: prep
    title: Strain out whole seeds
    emoji: "🕸️"
    do: Pour the crushed berries through a fine-mesh sieve into a clean pitcher, pressing firmly with the back of a spoon to extract all the juice while leaving whole seeds behind.

  - phase: prep
    title: Blitz dry mix into seedless purée
    emoji: "⚡"
    timer: 2m
    do: Pour the dry sugar and guar mix into the strained seedless purée and blitz with your Stabmixer for 2 minutes until completely dissolved and slightly thickened.

  - phase: chill
    title: Chill base
    emoji: "❄️"
    timer: 2h
    do: Refrigerate covered for 2–4 hours until completely cold.

  - phase: churn
    title: Churn sorbet
    emoji: "🍇"
    timer: 20m
    do: Churn chilled seedless purée in the spinning machine until thick sorbet forms.

  - phase: pack
    title: Pack into freezer tub
    emoji: "📦"
    do: Transfer to a chilled container and freeze for 3–4 hours to harden.
